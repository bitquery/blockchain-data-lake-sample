# Example Trino catalog config for the Iceberg lakehouse demo.
#
# Drop this in as /etc/trino/catalog/iceberg.properties.
#
# The URIs below use the docker-compose service names (catalog, lake), which is
# correct when Trino runs as a container on the same compose network. If your
# Trino runs elsewhere and reaches the stack over the published host ports,
# replace them with the host address, e.g. http://<host>:8181 and
# http://<host>:8333.

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog:8181
iceberg.rest-catalog.warehouse=s3://archive/iceberg

fs.native-s3.enabled=true
s3.endpoint=http://lake:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=secret
